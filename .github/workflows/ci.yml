name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install tools from .tool-versions
        uses: asdf-vm/actions/install@v4

      - name: Cache Dart and Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-deps-${{ hashFiles('.tool-versions', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Verify tool versions
        run: |
          flutter --version
          java -version
          asdf current gradle
          asdf exec gradle --version

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Build Web
        run: flutter build web --release --no-wasm-dry-run

      - name: Configure Flutter SDK for Gradle
        run: printf 'flutter.sdk=%s\n' "$(asdf where flutter)" > android/local.properties

      - name: Build Android APK with asdf Gradle
        run: asdf exec gradle --project-dir android assembleDebug

      - name: Package build outputs
        run: |
          mkdir -p build/artifacts
          tar -czf build/artifacts/weather-web.tar.gz -C build/web .
          cp build/app/outputs/flutter-apk/app-debug.apk build/artifacts/weather-app-debug.apk

      - name: Upload build outputs
        uses: actions/upload-artifact@v7
        with:
          name: weather-app-${{ github.sha }}
          path: build/artifacts/*
          if-no-files-found: error
          retention-days: 14
